title: Certutil Used to Download or Decode Payloads
id: 703841a0-f277-4072-8247-6f1b478b45a3
status: test
description: certutil abused as a downloader (-urlcache/-verifyctl) or to decode base64 payloads.
references:
- https://attack.mitre.org/techniques/T1105/
author: Praveen
date: '2026-09-19'
tags:
- attack.command_and_control
- attack.t1105
- attack.defense_evasion
- attack.t1140
logsource:
  category: process_creation
  product: windows
detection:
  sel_img:
    Image|endswith: \certutil.exe
  sel_dl:
    CommandLine|contains:
    - urlcache
    - verifyctl
  sel_dec:
    CommandLine|contains: -decode
  condition: sel_img and (sel_dl or sel_dec)
falsepositives:
- Rare admin use of certutil -urlcache for CRL testing
level: high
