title: NTDS.dit Extraction via Ntdsutil or Shadow Copy
id: 88b359a4-95b1-4d08-b831-e09259b5e87d
status: test
description: Copying the Active Directory database (ntds.dit), either with ntdsutil "ifm" or by reading it from a
  volume shadow copy. Whoever holds ntds.dit can crack or reuse every domain password hash.
references:
- https://attack.mitre.org/techniques/T1003/003/
author: Praveen
date: '2026-11-09'
tags:
- attack.credential_access
- attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  sel_ntdsutil:
    Image|endswith: \ntdsutil.exe
    CommandLine|contains: ifm
  sel_copy:
    CommandLine|contains: \ntds.dit
  sel_copy_tool:
    CommandLine|contains:
    - copy
    - esentutl
    - HarddiskVolumeShadowCopy
  condition: sel_ntdsutil or (sel_copy and sel_copy_tool)
falsepositives:
- Planned AD backups or domain-controller promotion from media (IFM), which should be change-controlled
level: critical
