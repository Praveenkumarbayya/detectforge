title: Windows Event Logs Cleared via wevtutil
id: e785ce0b-9b7c-4860-b8b4-72f182ff72fe
status: test
description: Adversaries clear Security/System logs to remove evidence.
references:
- https://attack.mitre.org/techniques/T1070/001/
author: Praveen
date: '2026-09-19'
tags:
- attack.defense_evasion
- attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  sel_img:
    Image|endswith: \wevtutil.exe
  sel_cmd:
    CommandLine|contains:
    - ' cl '
    - ' clear-log '
  condition: sel_img and sel_cmd
falsepositives:
- Log-rotation scripts (should be rare and change-managed)
level: high
