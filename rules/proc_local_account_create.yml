title: Local User Account Created via net.exe
id: a2989499-cbe0-4e29-bec8-932ccb5664df
status: test
description: Creation of a local account with 'net user /add' - backdoor account persistence.
references:
- https://attack.mitre.org/techniques/T1136/001/
author: Praveen
date: '2026-09-19'
tags:
- attack.persistence
- attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  sel_img:
    Image|endswith:
    - \net.exe
    - \net1.exe
  sel_cmd:
    CommandLine|contains|all:
    - user
    - ' /add'
  condition: sel_img and sel_cmd
falsepositives:
- Provisioning scripts on lab/kiosk machines
level: high
