title: WMI Used to Launch a Process Locally or Remotely
id: 5c2b9bd9-fb93-47b3-87c1-8fe25d7ccc82
status: test
description: wmic "process call create" or PowerShell Invoke-WmiMethod / Invoke-CimMethod Win32_Process Create.
  Attackers use WMI to start payloads without a direct parent-child link, and with /node to run them on other hosts.
references:
- https://attack.mitre.org/techniques/T1047/
author: Praveen
date: '2026-11-09'
tags:
- attack.execution
- attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  sel_wmic:
    Image|endswith: \wmic.exe
    CommandLine|contains|all:
    - process
    - call
    - create
  sel_ps:
    CommandLine|contains:
    - Invoke-WmiMethod
    - Invoke-CimMethod
  sel_ps_class:
    CommandLine|contains: Win32_Process
  condition: sel_wmic or (sel_ps and sel_ps_class)
falsepositives:
- Software deployment and inventory tools (SCCM, RMM agents) that create processes over WMI
level: medium
