title: Office Application Spawning Script Interpreter or Shell
id: 61a423ab-3db3-46ac-a8d8-a389ec9a4687
status: test
description: Word/Excel/PowerPoint/Outlook spawning cmd, PowerShell or script hosts - typical of macro-based phishing.
references:
- https://attack.mitre.org/techniques/T1566/001/
author: Praveen
date: '2026-09-19'
tags:
- attack.initial_access
- attack.t1566.001
- attack.execution
- attack.t1204.002
logsource:
  category: process_creation
  product: windows
detection:
  sel_parent:
    ParentImage|endswith:
    - \winword.exe
    - \excel.exe
    - \powerpnt.exe
    - \outlook.exe
  sel_child:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
  condition: sel_parent and sel_child
falsepositives:
- Legacy Office add-ins launching cmd (document and allow-list)
level: high
