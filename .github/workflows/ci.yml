name: detection-ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Lint rules (quality gate)
        run: PYTHONPATH=. python -m detectforge validate
      - name: Unit-test rules (true positives + benign corpus)
        run: PYTHONPATH=. python -m detectforge test && PYTHONPATH=. pytest -q
      - name: Build coverage, compliance and SIEM content
        run: |
          PYTHONPATH=. python -m detectforge coverage
          PYTHONPATH=. python -m detectforge compliance
          PYTHONPATH=. python -m detectforge convert
      - uses: actions/upload-artifact@v4
        with: { name: detection-content, path: out/ }
