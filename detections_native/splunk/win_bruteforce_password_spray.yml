title: Windows Brute Force or Password Spray (Failed Logon Burst)
id: 925dfa64-6a35-4a6e-88ea-e958a77df4c3
status: test
kind: splunk_native
description: Many failed logons (Security EID 4625) from one source within 15 minutes. Many failures against
  one or two accounts look like password guessing (T1110.001). Failures spread across many different accounts
  look like password spraying (T1110.003).
references:
- https://attack.mitre.org/techniques/T1110/001/
- https://attack.mitre.org/techniques/T1110/003/
author: Praveen
date: '2026-11-09'
tags:
- attack.credential_access
- attack.t1110.001
- attack.t1110.003
level: high
falsepositives:
- A user or service with a stale saved password retrying in a loop (shows as many failures, one account)
- Vulnerability scanners doing authenticated checks with wrong credentials
# Why this is native SPL and not a Sigma rule: it counts events over a time window. DetectForge's Sigma rules
# and offline evaluator are single-event matchers (aggregations raise NotImplementedError rather than silently
# passing), so this detection is validated live in the lab instead (see lab/VALIDATION.md).
thresholds:
  failures: 10
  distinct_users: 5
schedule:
  cron: '*/5 * * * *'
  earliest: -15m@m
  latest: now
  suppress_fields: host,src_ip
  suppress_period: 30m
search: >-
  index=wineventlog EventCode=4625
  | rex "Account For Which Logon Failed:[\s\S]*?Account Name:\s+(?<target_user>[^\r\n]+)"
  | rex "Source Network Address:\s+(?<src_ip>[^\r\n]+)"
  | rex "Logon Type:\s+(?<logon_type>\d+)"
  | eval target_user=trim(target_user), src_ip=coalesce(nullif(trim(src_ip), "-"), "local")
  | stats count AS failures dc(target_user) AS distinct_users values(target_user) AS users
    values(logon_type) AS logon_types min(_time) AS first_seen max(_time) AS last_seen BY host src_ip
  | where failures >= {failures} OR distinct_users >= {distinct_users}
  | eval pattern=if(distinct_users >= {distinct_users}, "T1110.003 password spraying", "T1110.001 password guessing")
  | convert ctime(first_seen) ctime(last_seen)
  | eval detectforge_rule="win_bruteforce_password_spray"
