id: e785ce0b-9b7c-4860-b8b4-72f182ff72fe
name: Windows Event Logs Cleared via wevtutil
description: Adversaries clear Security/System logs to remove evidence.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: PT15M
queryPeriod: PT15M
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1070
query: |
  SysmonProcessCreate
  | where Image endswith "\\wevtutil.exe" and (CommandLine contains " cl " or CommandLine contains " clear-log ")
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: CommandLine
version: 1.0.0
kind: Scheduled
