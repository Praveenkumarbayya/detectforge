id: 703841a0-f277-4072-8247-6f1b478b45a3
name: Certutil Used to Download or Decode Payloads
description: certutil abused as a downloader (-urlcache/-verifyctl) or to decode base64 payloads.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: PT15M
queryPeriod: PT15M
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
- CommandAndControl
- DefenseEvasion
relevantTechniques:
- T1105
- T1140
query: |
  SysmonProcessCreate
  | where Image endswith "\\certutil.exe" and ((CommandLine contains "urlcache" or CommandLine contains "verifyctl") or CommandLine contains "-decode")
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: CommandLine
version: 1.0.0
kind: Scheduled
