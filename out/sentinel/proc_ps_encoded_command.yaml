id: 0e8d0ba2-5f08-4013-8e54-4a873edb4d68
name: Suspicious Encoded PowerShell Command
description: PowerShell launched with an encoded command, a staple of malware loaders and hands-on-keyboard intrusion.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: PT15M
queryPeriod: PT15M
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
- Execution
- DefenseEvasion
relevantTechniques:
- T1059
- T1027
query: |
  SysmonProcessCreate
  | where (Image endswith "\\powershell.exe" or Image endswith "\\pwsh.exe") and (CommandLine contains " -enc " or CommandLine contains " -EncodedCommand " or CommandLine contains " -ec ") and (not(ParentImage endswith "\\ccmexec.exe"))
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: CommandLine
version: 1.0.0
kind: Scheduled
