id: 6cd06e25-7967-483a-b2e6-178d4af42c0e
name: Microsoft Defender Real-Time Protection Disabled
description: Set-MpPreference used to disable Defender protections or add broad exclusions.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: PT15M
queryPeriod: PT15M
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1562
query: |
  SysmonProcessCreate
  | where (Image endswith "\\powershell.exe" or Image endswith "\\pwsh.exe") and (CommandLine contains "DisableRealtimeMonitoring $true" or CommandLine contains "DisableRealtimeMonitoring 1" or CommandLine contains "-ExclusionPath")
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: CommandLine
version: 1.0.0
kind: Scheduled
