id: d8dfd208-57e2-429f-96dc-8009fb7a850c
name: Mshta Executing Remote or Inline Script
description: mshta.exe fetching a remote HTA or running inline JavaScript/VBScript - a common signed-binary proxy execution
  method.
severity: High
status: Available
requiredDataConnectors: []
queryFrequency: PT15M
queryPeriod: PT15M
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
- DefenseEvasion
- Execution
relevantTechniques:
- T1218
query: |
  SysmonProcessCreate
  | where Image endswith "\\mshta.exe" and (CommandLine contains "http://" or CommandLine contains "https://" or CommandLine contains "javascript:" or CommandLine contains "vbscript:")
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: CommandLine
version: 1.0.0
kind: Scheduled
