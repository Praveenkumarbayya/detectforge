id: eeed27be-6c9a-4e1c-b615-a5438c30f40d
name: Registry Run Key Persistence via reg.exe
description: A new value written to a Run/RunOnce autostart key using reg.exe.
severity: Medium
status: Available
requiredDataConnectors: []
queryFrequency: PT15M
queryPeriod: PT15M
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
- Persistence
- PrivilegeEscalation
relevantTechniques:
- T1547
query: |
  SysmonProcessCreate
  | where Image endswith "\\reg.exe" and CommandLine contains "add" and (CommandLine contains "\\CurrentVersion\\Run" or CommandLine contains "\\CurrentVersion\\RunOnce")
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Computer
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: CommandLine
version: 1.0.0
kind: Scheduled
