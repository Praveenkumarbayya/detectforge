[DetectForge - Windows Brute Force or Password Spray (Failed Logon Burst)]
description = Many failed logons (Security EID 4625) from one source within 15 minutes. Many failures against one or two accounts look like password guessing (T1110.001). Failures spread across many different accounts look like password spraying (T1110.003). (DetectForge native id 925dfa64-6a35-4a6e-88ea-e958a77df4c3)
search = index=wineventlog EventCode=4625 | rex "Account For Which Logon Failed:[\s\S]*?Account Name:\s+(?<target_user>[^\r\n]+)" | rex "Source Network Address:\s+(?<src_ip>[^\r\n]+)" | rex "Logon Type:\s+(?<logon_type>\d+)" | eval target_user=trim(target_user), src_ip=coalesce(nullif(trim(src_ip), "-"), "local") | stats count AS failures dc(target_user) AS distinct_users values(target_user) AS users values(logon_type) AS logon_types min(_time) AS first_seen max(_time) AS last_seen BY host src_ip | where failures >= 10 OR distinct_users >= 5 | eval pattern=if(distinct_users >= 5, "T1110.003 password spraying", "T1110.001 password guessing") | convert ctime(first_seen) ctime(last_seen) | eval detectforge_rule="win_bruteforce_password_spray"
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host,src_ip
alert.suppress.period = 30m
