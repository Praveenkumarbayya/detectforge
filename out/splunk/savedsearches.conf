# Generated by `python -m detectforge convert` from rules/*.yml and detections_native/. Do not edit by hand.

[DetectForge - Admin Share Mounted or Used for Remote Copy]
description = net use against C$ or ADMIN$, or copying a file to a remote admin share. Attackers use this to stage tools on other hosts before running them remotely (PsExec-style lateral movement). (Sigma id 4db95c3b-4dfa-44b6-a755-9a29ff2fd453)
search = index=sysmon EventCode=1 CommandLine IN ("*\\C$*", "*\\ADMIN$*") CommandLine IN ("*net use*", "*net.exe use*", "*copy*", "*xcopy*", "*robocopy*", "*Copy-Item*") | eval detectforge_rule="proc_admin_share_access", attack="T1021.002" | table _time host User ParentImage Image CommandLine detectforge_rule attack
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.index_earliest = -5m@m
dispatch.index_latest = @m
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 3

